---
# ==============================================================================
# Role: proxmox_vm_configure
# Defaults — post-provision OS configuration
# ==============================================================================

# ── Target VM ──────────────────────────────────────────────────────────────
vm_fqdn:    ""      # Mandatory — e.g. testserver01.technexus.com
vm_name:    ""      # Mandatory — short hostname e.g. testserver01
vm_ip:      ""      # Mandatory — e.g. 192.168.4.120

# ── Network ────────────────────────────────────────────────────────────────
vm_netmask:  "24"
vm_gateway:  "192.168.4.1"
vm_dns1:     "192.168.4.102"   # ctrl as primary DNS
vm_dns2:     "8.8.8.8"

# ── Ansible Service Account ────────────────────────────────────────────────
ansible_service_user:  "ansible_aap"
ansible_pub_key_path:  "/home/ansible_aap/.ssh/id_ed25519.pub"

# ── SELinux ────────────────────────────────────────────────────────────────
selinux_state: "permissive"    # Use enforcing in production

# ── Base Packages ──────────────────────────────────────────────────────────
base_packages:
  - qemu-guest-agent
  - python3
  - python3-pip
  - git
  - vim
  - curl
  - wget
  - bash-completion
  - net-tools
  - bind-utils
  - tmux
  - rsync
  - tar
  - unzip

# ── Lab Host Map (for /etc/hosts) ─────────────────────────────────────────
lab_hosts:
  - { ip: "192.168.4.102", fqdn: "ctrl.technexus.com",    short: "ctrl" }
  - { ip: "192.168.4.103", fqdn: "exec1.technexus.com",   short: "exec1" }
  - { ip: "192.168.4.104", fqdn: "exec2.technexus.com",   short: "exec2" }
  - { ip: "192.168.4.105", fqdn: "hub.technexus.com",     short: "hub" }
  - { ip: "192.168.4.106", fqdn: "eda.technexus.com",     short: "eda" }
  - { ip: "192.168.4.107", fqdn: "gate.technexus.com",    short: "gate" }
  - { ip: "192.168.4.108", fqdn: "mnt.technexus.com",     short: "mnt" }
  - { ip: "192.168.4.109", fqdn: "jenkins.technexus.com", short: "jenkins" }
