---
# ==============================================================================
# Role: proxmox_vm_delete
# Tasks: Safely stop and destroy a VM with name confirmation guard
# ==============================================================================

- name: "Validate required variables"
  ansible.builtin.assert:
    that:
      - vm_id | string | length > 0
      - vm_name_confirm | string | length > 0
      - proxmox_token_secret | string | length > 0
    fail_msg: "vm_id, vm_name_confirm and proxmox_token_secret are required"

- name: "Get current VM info from Proxmox"
  ansible.builtin.uri:
    url: "https://{{ proxmox_host }}:{{ proxmox_port }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/config"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_user }}!{{ proxmox_token_id }}={{ proxmox_token_secret }}"
    validate_certs: false
    status_code: [200, 500]
  register: vm_info
  failed_when: false

- name: "Abort if VM does not exist"
  ansible.builtin.fail:
    msg: "VM with ID {{ vm_id }} does not exist on {{ proxmox_node }}"
  when: vm_info.status != 200

- name: "Set actual VM name from Proxmox"
  ansible.builtin.set_fact:
    actual_vm_name: "{{ vm_info.json.data.name }}"

- name: "Safety check — confirm VM name matches"
  ansible.builtin.assert:
    that:
      - actual_vm_name == vm_name_confirm
    fail_msg: >
      SAFETY CHECK FAILED: VM name '{{ actual_vm_name }}' does not match
      confirmation '{{ vm_name_confirm }}'. Aborting to prevent accidental deletion.
    success_msg: "Safety check passed — VM name confirmed: {{ actual_vm_name }}"

- name: "Stop VM before deletion"
  community.proxmox.proxmox_kvm:
    api_host:         "{{ proxmox_host }}"
    api_port:         "{{ proxmox_port }}"
    api_user:         "{{ proxmox_user }}"
    api_token_id:     "{{ proxmox_token_id }}"
    api_token_secret: "{{ proxmox_token_secret }}"
    validate_certs:   false
    node:             "{{ proxmox_node }}"
    vmid:             "{{ vm_id }}"
    state:            stopped
    force_stop:       true
  register: stop_result
  failed_when: false

- name: "Wait for VM to stop"
  ansible.builtin.pause:
    seconds: 5

- name: "Delete VM and purge disks"
  community.proxmox.proxmox_kvm:
    api_host:         "{{ proxmox_host }}"
    api_port:         "{{ proxmox_port }}"
    api_user:         "{{ proxmox_user }}"
    api_token_id:     "{{ proxmox_token_id }}"
    api_token_secret: "{{ proxmox_token_secret }}"
    validate_certs:   false
    node:             "{{ proxmox_node }}"
    vmid:             "{{ vm_id }}"
    purge:            "{{ vm_purge_disks }}"
    state:            absent

- name: "Display deletion summary"
  ansible.builtin.debug:
    msg:
      - "════════════════════════════════════════════"
      - " VM DELETED SUCCESSFULLY"
      - "════════════════════════════════════════════"
      - " Name     : {{ actual_vm_name }}"
      - " VMID     : {{ vm_id }}"
      - " Purged   : {{ vm_purge_disks }}"
      - "════════════════════════════════════════════"
