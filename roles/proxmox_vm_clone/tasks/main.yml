---
# ==============================================================================
# Role: proxmox_vm_clone
# Tasks: Clone cloud-init template → inject config → wait for SSH
# ==============================================================================

- name: "Validate required variables"
  ansible.builtin.assert:
    that:
      - vm_id | string | length > 0
      - vm_name | string | length > 0
      - vm_ip | string | length > 0
      - proxmox_token_secret | string | length > 0
    fail_msg: "vm_id, vm_name, vm_ip and proxmox_token_secret are required"
    success_msg: "Input validation passed"

- name: "Set ansible_aap public key"
  ansible.builtin.set_fact:
    ansible_pub_key: "{{ ansible_aap_pub_key }}"

- name: "Clone template to new VM"
  community.proxmox.proxmox_kvm:
    api_host:         "{{ proxmox_host }}"
    api_port:         "{{ proxmox_port }}"
    api_user:         "{{ proxmox_user }}"
    api_token_id:     "{{ proxmox_token_id }}"
    api_token_secret: "{{ proxmox_token_secret }}"
    validate_certs:   false
    node:             "{{ proxmox_node }}"
    vmid:             "{{ template_vmid }}"
    newid:            "{{ vm_id }}"
    name:             "{{ vm_name }}"
    clone:            "{{ vm_name }}"
    full:             true
    storage:          "{{ vm_disk_storage }}"
    state:            present
  register: clone_result

- name: "Wait 5 seconds for clone to settle"
  ansible.builtin.pause:
    seconds: 5

- name: "Update VM hardware specs"
  community.proxmox.proxmox_kvm:
    api_host:         "{{ proxmox_host }}"
    api_port:         "{{ proxmox_port }}"
    api_user:         "{{ proxmox_user }}"
    api_token_id:     "{{ proxmox_token_id }}"
    api_token_secret: "{{ proxmox_token_secret }}"
    validate_certs:   false
    node:             "{{ proxmox_node }}"
    vmid:             "{{ vm_id }}"
    memory:           "{{ vm_memory }}"
    cores:            "{{ vm_cpu }}"
    net:
      net0: "virtio,bridge={{ vm_net_bridge }}"
    update:           true
    state:            present

- name: "Set cloud-init network config"
  ansible.builtin.uri:
    url: "https://{{ proxmox_host }}:{{ proxmox_port }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/config"
    method: POST
    headers:
      Authorization: "PVEAPIToken={{ proxmox_user }}!{{ proxmox_token_id }}={{ proxmox_token_secret }}"
    body_format: json
    body:
      ipconfig0: "ip={{ vm_ip }}/{{ vm_netmask }},gw={{ vm_gateway }}"
      nameserver: "{{ vm_dns }} {{ vm_dns2 }}"
      searchdomain: "technexus.com"
      ciuser: "{{ cloudinit_user }}"
      sshkeys: "{{ (ansible_pub_key) | urlencode }}"
    validate_certs: false
    status_code: 200
  register: cloudinit_config

- name: "Set hostname via cloud-init"
  ansible.builtin.uri:
    url: "https://{{ proxmox_host }}:{{ proxmox_port }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/config"
    method: POST
    headers:
      Authorization: "PVEAPIToken={{ proxmox_user }}!{{ proxmox_token_id }}={{ proxmox_token_secret }}"
    body_format: json
    body:
      name: "{{ vm_name }}"
      ciupgrade: 0
    validate_certs: false
    status_code: 200

- name: "Regenerate cloud-init image"
  ansible.builtin.uri:
    url: "https://{{ proxmox_host }}:{{ proxmox_port }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/cloudinit/generate"
    method: PUT
    headers:
      Authorization: "PVEAPIToken={{ proxmox_user }}!{{ proxmox_token_id }}={{ proxmox_token_secret }}"
    validate_certs: false
    status_code: [200, 500]
  failed_when: false

- name: "Start VM"
  community.proxmox.proxmox_kvm:
    api_host:         "{{ proxmox_host }}"
    api_port:         "{{ proxmox_port }}"
    api_user:         "{{ proxmox_user }}"
    api_token_id:     "{{ proxmox_token_id }}"
    api_token_secret: "{{ proxmox_token_secret }}"
    validate_certs:   false
    node:             "{{ proxmox_node }}"
    vmid:             "{{ vm_id }}"
    state:            started

- name: "Wait for SSH to become available (cloud-init booting)"
  ansible.builtin.wait_for:
    host:    "{{ vm_ip }}"
    port:    22
    timeout: "{{ vm_ssh_wait_timeout }}"
    delay:   "{{ vm_ssh_wait_delay }}"
    state:   started
  delegate_to: localhost

- name: "VM clone complete — SSH is ready"
  ansible.builtin.debug:
    msg:
      - "════════════════════════════════════════════"
      - " VM CLONED AND READY"
      - "════════════════════════════════════════════"
      - " Name      : {{ vm_name }}"
      - " VMID      : {{ vm_id }}"
      - " Template  : {{ template_vmid }}"
      - " IP        : {{ vm_ip }}"
      - " SSH User  : {{ cloudinit_user }}"
      - " SSH Ready : YES ✔"
      - "════════════════════════════════════════════"
      - " proxmox_vm_configure role will run next"
      - "════════════════════════════════════════════"
